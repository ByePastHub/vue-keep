name: Feature Request
description: 提出一个新功能建议
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      placeholder: 请描述你期望的功能
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 使用场景
      placeholder: 请描述这个功能的使用场景
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      placeholder: 你是否考虑过其他替代方案？
